<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globe Trotter | Authentication</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-xl shadow-2xl p-8">
        <!-- Logo / Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-blue-500 tracking-tight">Globe Trotter</h1>
            <p class="text-slate-400 text-sm mt-1">Plan, visualize, and share your journeys</p>
        </div>

        <!-- Tab Toggle Buttons -->
        <div class="flex border-b border-slate-700 mb-6">
            <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2 text-center font-semibold text-blue-400 border-b-2 border-blue-400 focus:outline-none transition">
                Log In
            </button>
            <button id="tab-signup" onclick="switchTab('signup')" class="flex-1 py-2 text-center font-semibold text-slate-400 hover:text-slate-200 focus:outline-none transition">
                Sign Up
            </button>
        </div>

        <!-- Notification / Error Banner -->
        <div id="alert-box" class="hidden p-3 mb-4 rounded text-sm font-medium"></div>

        <!-- Login Form -->
        <form id="form-login" onsubmit="handleAuth(event, 'login')" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Email</label>
                <input type="email" id="login-email" required placeholder="you@example.com" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Password</label>
                    <a href="#" onclick="alert('Password reset link sent to your email!')" class="text-xs text-blue-400 hover:underline">Forgot Password?</a>
                </div>
                <input type="password" id="login-password" required placeholder="••••••••" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 font-semibold rounded-lg shadow-lg transition">
                Log In
            </button>
        </form>

        <!-- Signup Form (Hidden by default) -->
        <form id="form-signup" onsubmit="handleAuth(event, 'signup')" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Full Name</label>
                <input type="text" id="signup-name" required placeholder="John Doe" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Email</label>
                <input type="email" id="signup-email" required placeholder="you@example.com" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Password</label>
                <input type="password" id="signup-password" minlength="6" required placeholder="At least 6 characters" class="w-full px-4 py-2 bg-slate-900 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full py-2.5 bg-green-600 hover:bg-green-700 font-semibold rounded-lg shadow-lg transition">
                Create Account
            </button>
        </form>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000/api';

        function switchTab(mode) {
            const loginTab = document.getElementById('tab-login');
            const signupTab = document.getElementById('tab-signup');
            const loginForm = document.getElementById('form-login');
            const signupForm = document.getElementById('form-signup');
            hideAlert();

            if (mode === 'login') {
                loginTab.className = "flex-1 py-2 text-center font-semibold text-blue-400 border-b-2 border-blue-400 focus:outline-none transition";
                signupTab.className = "flex-1 py-2 text-center font-semibold text-slate-400 hover:text-slate-200 focus:outline-none transition";
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
            } else {
                signupTab.className = "flex-1 py-2 text-center font-semibold text-green-400 border-b-2 border-green-400 focus:outline-none transition";
                loginTab.className = "flex-1 py-2 text-center font-semibold text-slate-400 hover:text-slate-200 focus:outline-none transition";
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            }
        }

        function showAlert(msg, isSuccess = false) {
            const alertBox = document.getElementById('alert-box');
            alertBox.textContent = msg;
            alertBox.className = `p-3 mb-4 rounded text-sm font-medium ${isSuccess ? 'bg-green-900/50 text-green-300 border border-green-700' : 'bg-red-900/50 text-red-300 border border-red-700'}`;
            alertBox.classList.remove('hidden');
        }

        function hideAlert() {
            document.getElementById('alert-box').classList.add('hidden');
        }

        async function handleAuth(event, type) {
            event.preventDefault();
            hideAlert();

            const payload = type === 'login' 
                ? {
                    email: document.getElementById('login-email').value,
                    password: document.getElementById('login-password').value
                }
                : {
                    name: document.getElementById('signup-name').value,
                    email: document.getElementById('signup-email').value,
                    password: document.getElementById('signup-password').value
                };

            try {
                const response = await fetch(`${API_BASE_URL}/auth/${type}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Authentication failed');
                }

                // Store session token and redirect to dashboard
                localStorage.setItem('gt_token', data.access_token);
                localStorage.setItem('user_email', payload.email);
                showAlert(type === 'login' ? 'Login successful! Redirecting...' : 'Account created! Redirecting...', true);
                
                setTimeout(() => {
                    // If login, go to dashboard. If signup, go to profile setup.
                    window.location.href = type === 'login' ? 'index.html' : 'profile-setup.html';
                }, 1000);

            } catch (err) {
                showAlert(err.message);
            }
        }
    </script>
</body>
</html>
