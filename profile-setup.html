<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globe Trotter | System Initialization</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 flex items-center justify-center min-h-screen p-4 font-mono">

    <div class="w-full max-w-lg bg-slate-900 border border-cyan-500/30 shadow-[0_0_20px_rgba(6,182,212,0.15)] rounded-lg p-8">
        
        <div class="mb-8 border-b border-cyan-500/30 pb-4">
            <h2 class="text-2xl font-bold text-cyan-400 tracking-widest uppercase">Traveler Profile Initialization</h2>
            <p class="text-slate-400 text-xs mt-2 uppercase tracking-wide">Please complete your system profile to continue</p>
        </div>

        <form id="profile-form" onsubmit="saveProfile(event)" class="space-y-5">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-cyan-500 uppercase tracking-wider mb-1">First Name</label>
                    <input type="text" id="first-name" required class="w-full px-4 py-2 bg-slate-950 border border-cyan-500/30 rounded text-cyan-100 focus:outline-none focus:border-cyan-400 focus:shadow-[0_0_10px_rgba(6,182,212,0.3)] transition-all">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-cyan-500 uppercase tracking-wider mb-1">Last Name</label>
                    <input type="text" id="last-name" required class="w-full px-4 py-2 bg-slate-950 border border-cyan-500/30 rounded text-cyan-100 focus:outline-none focus:border-cyan-400 focus:shadow-[0_0_10px_rgba(6,182,212,0.3)] transition-all">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-cyan-500 uppercase tracking-wider mb-1">Mobile Number</label>
                <input type="tel" id="mobile" required placeholder="+1 234 567 8900" class="w-full px-4 py-2 bg-slate-950 border border-cyan-500/30 rounded text-cyan-100 focus:outline-none focus:border-cyan-400 focus:shadow-[0_0_10px_rgba(6,182,212,0.3)] transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold text-cyan-500 uppercase tracking-wider mb-1">Home Address</label>
                <textarea id="address" rows="3" required class="w-full px-4 py-2 bg-slate-950 border border-cyan-500/30 rounded text-cyan-100 focus:outline-none focus:border-cyan-400 focus:shadow-[0_0_10px_rgba(6,182,212,0.3)] transition-all"></textarea>
            </div>

            <button type="submit" class="w-full mt-6 py-3 bg-cyan-600/20 hover:bg-cyan-500/40 text-cyan-300 border border-cyan-500/50 font-bold tracking-widest uppercase rounded shadow-[0_0_15px_rgba(6,182,212,0.2)] hover:shadow-[0_0_25px_rgba(6,182,212,0.4)] transition-all">
                Save & Initialize Dashboard
            </button>
        </form>
    </div>

    <script>
        async function saveProfile(event) {
            event.preventDefault();
            
            const profileData = {
                first_name: document.getElementById('first-name').value,
                last_name: document.getElementById('last-name').value,
                mobile_number: document.getElementById('mobile').value,
                address: document.getElementById('address').value
            };

            try {
                const response = await fetch('http://localhost:8000/api/profile', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        // In a real app, pass the token saved during signup
                        'Authorization': `Bearer ${localStorage.getItem('gt_token')}`
                    },
                    body: JSON.stringify(profileData)
                });

                if (response.ok) {
                    // Redirect to the main dashboard after saving
                    window.location.href = 'index.html';
                } else {
                    alert("System error saving profile.");
                }
            } catch (err) {
                console.error("Network error:", err);
            }
        }
    </script>
</body>
</html>
