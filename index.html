<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobeTrotter</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="gt-root">

  <!-- GLOBAL NAVBAR CONTAINER -->
  <div id="navbar-container"></div>

  <!-- MAIN APP PAGES CONTAINER -->
  <div id="app">
    <div id="login-page" class="page"></div>
    <div id="signup-page" class="page"></div>
    <div id="profile-setup-page" class="page"></div>
    <div id="profile-page" class="page"></div>
    <div id="dashboard-page" class="page"></div>
    <div id="create-trip-page" class="page"></div>
    <div id="explore-page" class="page"></div>
    <div id="destination-detail-page" class="page"></div>
    <div id="budget-page" class="page"></div>
    <div id="my-trips-page" class="page"></div>
    <div id="edit-trip-page" class="page"></div>
    <div id="trip-detail-page" class="page"></div>
    <div id="shared-itinerary-page" class="page"></div>
  </div>

  <!-- DYNAMIC TOAST & MODAL CONTAINERS -->
  <div id="toast-container"></div>
  <div id="modal-container"></div>

  <script src="script.js"></script>
</body>
</html>
